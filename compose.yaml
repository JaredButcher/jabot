# jabot under Docker Compose. Settings come from .env next to this file (see .env.example).
# TLS is the front proxy's job; the bot serves plain HTTP on HTTP_PORT.
services:
  jabot:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: sqlite://database.sqlite
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      HTTP_PORT: ${HTTP_PORT:-8080}
      BASE_PATH: ${BASE_PATH:-/jabot}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DOMAIN: ${DOMAIN:-}
      LAN_HOST: ${LAN_HOST:-}
      RUST_LOG: ${RUST_LOG:-info}
      # Daily backups with restic (src/backup); unset RESTIC_REPOSITORY disables them.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/b2_credentials
      RESTIC_COMPRESSION: max
      # The container's user has no home directory, so restic needs an explicit cache.
      RESTIC_CACHE_DIR: /data/.cache/restic
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-08:00}
      BOT_OWNER_ID: ${BOT_OWNER_ID:-}
    ports:
      # Loopback by default: reachable by a proxy on this machine, not from the network.
      - "${HTTP_PUBLISH:-127.0.0.1}:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    volumes:
      # Must be readable and writable by jabot user or group
      - ./data:/data
    secrets:
      - discord_token
      - restic_password
      - b2_credentials
    user: "${JABOT_UID}:${JABOT_GID}"

networks:
  default:
    ipam:
      config:
        # A fixed subnet keeps the gateway at 172.30.0.1. Connections to the published port
        # from this machine arrive from there, so that's the address for TRUSTED_PROXIES.
        - subnet: 172.30.0.0/24

secrets:
  discord_token:
    # Must be readable by jabot user or group
    file: ./secretes/discord_token
  # Backups. Both files must exist even with backups off (empty is fine), and be readable
  # by the jabot user. Keep copies of both in a password manager: without the password, the
  # backups can't be decrypted.
  restic_password:
    file: ./secrets/restic_password
  b2_credentials:
    # AWS-style credentials file holding the B2 application key (README, "Backups").
    file: ./secrets/b2_credentials
